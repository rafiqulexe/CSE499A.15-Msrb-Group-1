{% extends "auth_base.html" %}
{% block title %}Sign in{% endblock %}

{% block form %}
<div class="auth-head">
  <h1>Sign in</h1>
  <p>Access your attendance workspace.</p>
</div>

{% if error %}
<div class="auth-error" role="alert">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16.5" x2="12.01" y2="16.5"/>
  </svg>
  <span>{{ error }}</span>
</div>
{% endif %}

<form method="post" action="/login" class="auth-form">
  <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

  <div class="field">
    <label for="username">Username</label>
    <input id="username" name="username" value="{{ username or '' }}"
           autocomplete="username" autofocus required
           {% if error %}aria-invalid="true"{% endif %}>
  </div>

  <div class="field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required
           {% if error %}aria-invalid="true"{% endif %}>
  </div>

  <button type="submit" class="btn btn-primary btn-lg btn-block">Sign in</button>
</form>

<p class="auth-alt">No account yet? <a href="/signup">Create one</a></p>
{% endblock %}
