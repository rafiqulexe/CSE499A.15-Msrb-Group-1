<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in · CampusEye</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
  <div class="auth-wrap">
    <div class="auth-card">
      <a class="brand" href="/login">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5v6"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>
        </span>
        <span class="brand-text">
          <strong>CampusEye</strong>
          <small>Sophisticated Campus Monitoring</small>
        </span>
      </a>

      <div class="auth-head">
        <h1>Welcome back 👋</h1>
        <p>Sign in to your attendance workspace.</p>
      </div>

      {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}

      <form method="post" action="/login" class="auth-form">
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" value="{{ username or '' }}" autocomplete="username" autofocus required placeholder="Enter your username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary auth-submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Sign in
        </button>
      </form>

      <p class="auth-alt">New here? <a href="/signup">Create an account</a></p>
    </div>

    <p class="auth-foot">CSE499.15 · Group 7</p>
  </div>
</body>
</html>
